<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai-KMS</title>
    <style>
      /* Immediate Zero-Flash Dark Mode Baseline */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #171717;
        color: #ececec;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        background-color: #171717;
      }
      /* Pre-render Native Animated Splash Loader (Active at 0ms before JS bundles) */
      .aikms-preloader {
        position: fixed;
        inset: 0;
        background-color: #171717;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
      }
      .aikms-preloader-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.15rem;
      }
      .aikms-preloader-logo-wrapper {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .aikms-preloader-glow {
        position: absolute;
        inset: -10px;
        border-radius: 24px;
        background: radial-gradient(circle, rgba(16, 163, 127, 0.45) 0%, rgba(16, 163, 127, 0) 72%);
        animation: aikms-glow-pulse 2s ease-in-out infinite;
      }
      .aikms-preloader-logo-box {
        position: relative;
        width: 66px;
        height: 66px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(16, 163, 127, 0.22) 0%, rgba(10, 122, 94, 0.12) 100%);
        border: 1px solid rgba(16, 163, 127, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 30px rgba(16, 163, 127, 0.35);
        animation: aikms-logo-bounce 2.4s ease-in-out infinite;
      }
      .aikms-preloader-logo-svg {
        width: 34px;
        height: 34px;
        stroke: #ffffff;
        stroke-width: 2.1;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .aikms-preloader-title {
        font-size: 1.85rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ececec;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.1rem;
      }
      .aikms-preloader-title span {
        color: #10a37f;
      }
      .aikms-preloader-subtitle {
        font-size: 0.85rem;
        color: #8e8e8e;
        margin: -0.8rem 0 0 0;
        font-weight: 450;
      }
      .aikms-preloader-track {
        width: 150px;
        height: 3px;
        background-color: #262626;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-top: 0.2rem;
      }
      .aikms-preloader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #10a37f, #34d399, #10a37f);
        box-shadow: 0 0 10px rgba(16, 163, 127, 0.7);
        animation: aikms-loading-slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes aikms-glow-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.5; }
        50% { transform: scale(1.18); opacity: 0.95; }
      }
      @keyframes aikms-logo-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes aikms-loading-slide {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 0ms Instant Native Preloader: Guaranteed dark background and animated brand logo -->
      <div class="aikms-preloader">
        <div class="aikms-preloader-brand">
          <div class="aikms-preloader-logo-wrapper">
            <div class="aikms-preloader-glow"></div>
            <div class="aikms-preloader-logo-box">
              <img src="/logo-128.png" alt="AiKMS" style="width: 44px; height: 44px; object-fit: contain;" />
            </div>
          </div>
          <h1 class="aikms-preloader-title">Ai<span>KMS</span></h1>
          <p class="aikms-preloader-subtitle">Personal AI Learning Workspace</p>
          <div class="aikms-preloader-track">
            <div class="aikms-preloader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
